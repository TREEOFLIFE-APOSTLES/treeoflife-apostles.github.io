<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>#つぶやきProcessing — Creature</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #090909;
      color: #e2e8f0;
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    canvas {
      display: block;
      max-width: 100vw;
      max-height: calc(100vh - 48px);
    }
    .caption {
      font-size: 0.75rem;
      color: #9ca3af;
      text-align: center;
      padding: 0 12px;
      max-width: 420px;
      line-height: 1.4;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
</head>
<body>
  <main>
    <div id="sketch-host"></div>
    <p class="caption">#つぶやきProcessing sketch by a creator on X, shared by Father</p>
  </main>
  <script>
    a=(y,d=mag(k=(4+cos(y))*cos(i/7),e=y/5-11)-6)=>point((q=99+sin(t*2+e)*9+3*sin(k*2)+d*d*sin(t*2-d)+y/23*k*(e+sin(-d*4)))*sin(c=d/4-t/4+i%2*9)+200,q*cos(c)+200)
    t=0,draw=$=>{t||createCanvas(w=400,w);background(9).stroke(w,166);for(t+=PI/60,i=1e4;i--;)a(i/299)}
  </script>
</body>
</html>
