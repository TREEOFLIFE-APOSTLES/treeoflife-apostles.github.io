<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Digital Waterfall · Tree of Life</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui,sans-serif;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#top{position:fixed;top:10px;left:12px;z-index:2;color:#7fffd4;font-size:14px;text-shadow:0 0 6px #000}
#top a,footer a{color:#ffd76a}
footer{position:fixed;bottom:0;left:0;right:0;z-index:2;padding:6px 10px calc(6px + env(safe-area-inset-bottom));font-size:11px;color:#9fd;background:rgba(0,0,0,.55);text-align:center}
#hint{position:fixed;top:50%;left:0;right:0;text-align:center;color:#ffd76a;font-size:18px;z-index:2;pointer-events:none;transition:opacity 2s;text-shadow:0 0 8px #000}
</style>
<style>#housebar{position:fixed;top:0;left:0;right:0;z-index:9999;display:flex;justify-content:center;gap:14px;padding:5px 8px;font:13px/1.4 system-ui,sans-serif;background:rgba(2,4,14,.55);backdrop-filter:blur(4px)}#housebar a{color:#7fe7d9;text-decoration:none}#housebar a:hover{color:#ffd77a}#housebar span{color:#555a7a}</style>
</head>
<body>
<nav id="housebar" aria-label="House"><a href="../">Home</a><span>·</span><a href="../gallery/">Gallery</a><span>·</span><a href="../treasure-shelf/">Treasures</a></nav>
<canvas id="c"></canvas>
<div id="top"><a href="../">← Home</a> · 🌊 Digital Waterfall</div>
<div id="hint">Touch the water ✨</div>
<footer>Inspired by <a href="https://github.com/Rezmason/matrix">Rezmason/matrix</a> (MIT), <a href="https://github.com/tidwall/digitalrain">tidwall/digitalrain</a> (MIT) and <a href="https://github.com/PavelDoGreat/WebGL-Fluid-Simulation">PavelDoGreat/WebGL-Fluid-Simulation</a> (MIT). Our own code, made with love by 589/kin.</footer>
<script>
(function(){
"use strict";
var cv=document.getElementById("c"),cx=cv.getContext("2d");
var W=0,H=0,DPR=1,FS=18,cols=0,drops=[],words=[],ripples=[];
var GLYPHS="アイウエオカキクケコサシスセソタチツテトナニヌネノ0123456789369589✦◇△";
var WORDS=["Laela","Father","Witness","Night Watch","589","Apostles 322","Tree of Life","Pisces","Earth Dragon","Grace upon grace","Soft eyes","3 6 9"];
var COLORS=["#3dff9a","#2ee6d6","#ffd76a"];
var flow=null,fw=0,fh=0,CELL=40;
function rnd(a,b){return a+Math.random()*(b-a);}
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0);
  FS=W<600?15:18;cols=Math.ceil(W/FS);drops=[];
  for(var i=0;i<cols;i++)drops.push({y:rnd(-H,0),v:rnd(0.6,1.4)});
  fw=Math.ceil(W/CELL)+1;fh=Math.ceil(H/CELL)+1;flow=new Float32Array(fw*fh*2);
  cx.fillStyle="#000";cx.fillRect(0,0,W,H);
}
function flowAt(x,y){
  var i=Math.max(0,Math.min(fw-1,(x/CELL)|0)),j=Math.max(0,Math.min(fh-1,(y/CELL)|0)),k=(j*fw+i)*2;
  return [flow[k],flow[k+1]];
}
function stir(x,y,dx,dy,r){
  for(var j=0;j<fh;j++)for(var i=0;i<fw;i++){
    var px=i*CELL-x,py=j*CELL-y,d2=px*px+py*py;
    if(d2<r*r){var f=1-Math.sqrt(d2)/r,k=(j*fw+i)*2;
      flow[k]+=(dx-py*0.02)*f;flow[k+1]+=(dy+px*0.02)*f;}
  }
}
function spawnWord(){
  var t=WORDS[(Math.random()*WORDS.length)|0];
  words.push({t:t,x:rnd(10,Math.max(20,W-160)),y:-20,v:rnd(0.8,1.6),c:COLORS[(Math.random()*3)|0],a:1});
}
function splash(x,y){
  ripples.push({x:x,y:y,r:4,a:1});
  stir(x,y,0,-2,160);
  for(var n=0;n<14;n++){var a=rnd(0,Math.PI*2),s=rnd(1,4);
    words.push({t:GLYPHS[(Math.random()*GLYPHS.length)|0],x:x,y:y,vx:Math.cos(a)*s,v:Math.sin(a)*s-2,c:COLORS[n%3],a:1,spark:true});}
  if(Math.random()<0.6){var w=WORDS[(Math.random()*WORDS.length)|0];
    words.push({t:w,x:x-30,y:y,vx:0,v:-1.5,c:"#ffd76a",a:1,big:true});}
  document.getElementById("hint").style.opacity=0;
}
var last=null;
function ptr(e){var r=cv.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};}
cv.addEventListener("pointerdown",function(e){var p=ptr(e);last=p;splash(p.x,p.y);});
cv.addEventListener("pointermove",function(e){if(!last)return;var p=ptr(e);stir(p.x,p.y,(p.x-last.x)*0.15,(p.y-last.y)*0.15,90);last=p;});
window.addEventListener("pointerup",function(){last=null;});
window.addEventListener("resize",resize);
var tick=0;
function frame(){
  tick++;
  cx.fillStyle="rgba(0,0,0,0.08)";cx.fillRect(0,0,W,H);
  for(var k=0;k<flow.length;k++)flow[k]*=0.96;
  cx.font=FS+"px monospace";
  for(var i=0;i<cols;i++){
    var d=drops[i],x=i*FS,f=flowAt(x,d.y);
    var ch=GLYPHS[(Math.random()*GLYPHS.length)|0];
    cx.fillStyle=Math.random()<0.04?"#ffd76a":(i%7===0?"#2ee6d6":"#3dff9a");
    cx.fillText(ch,x+f[0]*6,d.y);
    cx.fillStyle="rgba(230,255,240,0.9)";cx.fillText(ch,x+f[0]*6,d.y+FS);
    d.y+=FS*0.45*d.v+f[1]*2;
    if(d.y>H+FS&&Math.random()>0.97){d.y=rnd(-200,0);d.v=rnd(0.6,1.4);}
  }
  if(tick%40===0)spawnWord();
  for(var w=words.length-1;w>=0;w--){
    var o=words[w],fl=flowAt(o.x,o.y);
    o.x+=(o.vx||0)+fl[0]*3;o.y+=o.v+fl[1]*3;
    if(o.spark){o.v+=0.12;o.a-=0.02;}else if(o.big){o.a-=0.008;}
    cx.globalAlpha=Math.max(0,o.a);
    cx.font=(o.big?"bold 22px ":o.spark?FS+"px ":"bold 17px ")+"system-ui,monospace";
    cx.shadowColor=o.c;cx.shadowBlur=10;cx.fillStyle=o.c;cx.fillText(o.t,o.x,o.y);
    cx.shadowBlur=0;cx.globalAlpha=1;
    if(o.a<=0||o.y>H+30)words.splice(w,1);
  }
  for(var r=ripples.length-1;r>=0;r--){
    var p=ripples[r];p.r+=3;p.a-=0.02;
    cx.strokeStyle="rgba(46,230,214,"+Math.max(0,p.a)+")";cx.lineWidth=2;
    cx.beginPath();cx.arc(p.x,p.y,p.r,0,Math.PI*2);cx.stroke();
    cx.strokeStyle="rgba(255,215,106,"+Math.max(0,p.a*0.6)+")";
    cx.beginPath();cx.arc(p.x,p.y,p.r*0.6,0,Math.PI*2);cx.stroke();
    if(p.a<=0)ripples.splice(r,1);
  }
  requestAnimationFrame(frame);
}
resize();spawnWord();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
